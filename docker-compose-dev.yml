services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka
    restart: on-failure
    env_file:
      - .env
    networks:
      - e-commerce_microservice
    volumes:
      - kafka_data:/var/lib/kafka/data

  postgres:
    image: postgres:15-alpine
    restart: on-failure
    env_file:
      - .env
    networks:
      - e-commerce_microservice
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: on-failure
    env_file:
      - .env
    ports:
      - '6379:6379'
    networks:
      - e-commerce_microservice
    volumes:
      - redis_data:/data

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: on-failure
    env_file:
      - .env
    networks:
      - e-commerce_microservice
    volumes:
      - mongodb_data:/data/db
    ports:
      - '27017:27017'

  users-service:
    container_name: users-service
    restart: on-failure
    build:
      context: .
      dockerfile: ./apps/users-service/dockerfile
    env_file:
      - .env
    networks:
      - e-commerce_microservice
    volumes:
      - ./apps/users-service:/app/apps/users-service:ro
    depends_on:
      - kafka
      - mongodb
      - redis

  auth-service:
    container_name: auth-service
    restart: on-failure
    build:
      context: .
      dockerfile: ./apps/auth-service/dockerfile
    secrets:
      - access_private_key
      - access_public_key
      - refresh_private_key
      - refresh_public_key
    env_file:
      - .env
    volumes:
      - ./apps/auth-service:/app/apps/auth-service:ro
    networks:
      - e-commerce_microservice
    depends_on:
      - kafka
      - postgres
      - redis

  notifications-service:
    container_name: notifications-service
    restart: on-failure
    build:
      context: .
      dockerfile: ./apps/notifications-service/dockerfile
    env_file:
      - .env
    volumes:
      - ./apps/notifications-service:/app/apps/notifications-service:ro
    networks:
      - e-commerce_microservice
    depends_on:
      - kafka

  api-gateway:
    container_name: api-gateway
    restart: on-failure
    build:
      context: .
      dockerfile: ./apps/api-gateway/dockerfile
    secrets:
      - access_public_key
      - refresh_public_key
    ports:
      - '3000:3000'
    env_file:
      - .env
    volumes:
      - ./apps/api-gateway:/app/apps/api-gateway:ro
    networks:
      - e-commerce_microservice
    depends_on:
      - auth-service
      - users-service

volumes:
  postgres_data:
  kafka_data:
  redis_data:
  mongodb_data:

networks:
  e-commerce_microservice:
    driver: bridge

secrets:
  access_private_key:
    file: ./keys/access-private.key

  access_public_key:
    file: ./keys/access-public.key

  refresh_private_key:
    file: ./keys/refresh-private.key

  refresh_public_key:
    file: ./keys/refresh-public.key
